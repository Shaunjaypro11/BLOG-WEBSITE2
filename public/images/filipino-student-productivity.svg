<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="prodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1C33" />
      <stop offset="50%" stop-color="#122543" />
      <stop offset="100%" stop-color="#0A1628" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#prodBg)" />

  <!-- Background Productivity Grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1.5">
    <circle cx="600" cy="337" r="300" fill="none" stroke-dasharray="6 6" />
    <circle cx="600" cy="337" r="200" fill="none" stroke-dasharray="4 4" />
    <line x1="600" y1="37" x2="600" y2="637" />
    <line x1="300" y1="337" x2="900" y2="337" />
  </g>

  <!-- Left: Semester Planning & Subject Boards (Philippine College / SHS context) -->
  <g transform="translate(120, 110)">
    <rect width="440" height="450" rx="16" fill="#0E1E36" stroke="#22395D" stroke-width="2" />
    <rect x="24" y="24" width="392" height="48" rx="10" fill="#172A4B" />
    <circle cx="48" cy="48" r="8" fill="#1E6FD9" />
    <text x="68" y="53" fill="#FFF" font-family="sans-serif" font-size="14" font-weight="700">PHILIPPINE SEMESTER WORKFLOW</text>

    <!-- Subjects Cards -->
    <g transform="translate(24, 90)">
      <!-- Subject 1 -->
      <rect width="392" height="65" rx="8" fill="#14243F" stroke="#1E6FD9" stroke-width="1" />
      <rect x="14" y="14" width="6" height="37" rx="3" fill="#1E6FD9" />
      <text x="32" y="32" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="600">IT Capstone / Senior High Research</text>
      <text x="32" y="50" fill="#94A3B8" font-family="sans-serif" font-size="11">AI Used: Research outlining &amp; literature search structure</text>
      <rect x="300" y="20" width="78" height="24" rx="12" fill="#1E3A5F" />
      <text x="339" y="36" fill="#60A5FA" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">ON TRACK</text>
    </g>

    <g transform="translate(24, 170)">
      <!-- Subject 2 -->
      <rect width="392" height="65" rx="8" fill="#14243F" stroke="#FCD116" stroke-width="1" />
      <rect x="14" y="14" width="6" height="37" rx="3" fill="#FCD116" />
      <text x="32" y="32" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="600">Data Structures &amp; Algorithms (BSIT)</text>
      <text x="32" y="50" fill="#94A3B8" font-family="sans-serif" font-size="11">AI Used: Debugging conceptual logic &amp; step-by-step traces</text>
      <rect x="300" y="20" width="78" height="24" rx="12" fill="#3D3412" />
      <text x="339" y="36" fill="#FCD116" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">STUDYING</text>
    </g>

    <g transform="translate(24, 250)">
      <!-- Subject 3 -->
      <rect width="392" height="65" rx="8" fill="#14243F" stroke="#10B981" stroke-width="1" />
      <rect x="14" y="14" width="6" height="37" rx="3" fill="#10B981" />
      <text x="32" y="32" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="600">Purposive Communication &amp; Ethics</text>
      <text x="32" y="50" fill="#94A3B8" font-family="sans-serif" font-size="11">AI Used: Grammar review while keeping original voice</text>
      <rect x="300" y="20" width="78" height="24" rx="12" fill="#133629" />
      <text x="339" y="36" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">REVIEWED</text>
    </g>

    <g transform="translate(24, 330)">
      <!-- Student Balance Notice -->
      <rect width="392" height="80" rx="8" fill="#11223B" />
      <text x="16" y="28" fill="#FCD116" font-family="sans-serif" font-size="12" font-weight="700">FILIPINO STUDENT TIME REALITY:</text>
      <text x="16" y="48" fill="#CBD5E1" font-family="sans-serif" font-size="11">Balancing long commutes, erratic Wi-Fi, and multiple subject requirements</text>
      <text x="16" y="66" fill="#60A5FA" font-family="sans-serif" font-size="11">AI provides schedule clarity, freeing mental bandwidth for deep learning.</text>
    </g>
  </g>

  <!-- Right: Efficiency vs Retention Chart -->
  <g transform="translate(620, 110)">
    <rect width="460" height="450" rx="16" fill="#0E1E36" stroke="#22395D" stroke-width="2" />
    <rect x="24" y="24" width="412" height="48" rx="10" fill="#172A4B" />
    <text x="44" y="53" fill="#FFF" font-family="sans-serif" font-size="14" font-weight="700">SMART PRODUCTIVITY BALANCE</text>

    <!-- Productivity Dial -->
    <g transform="translate(230, 210)">
      <!-- Outer Arc -->
      <circle cx="0" cy="0" r="100" fill="none" stroke="#1E2F4C" stroke-width="24" />
      <circle cx="0" cy="0" r="100" fill="none" stroke="#1E6FD9" stroke-width="24" stroke-dasharray="380 600" stroke-linecap="round" />
      <circle cx="0" cy="0" r="100" fill="none" stroke="#FCD116" stroke-width="24" stroke-dasharray="120 600" stroke-dashoffset="-280" stroke-linecap="round" />
      <text x="0" y="-8" fill="#FFF" font-family="sans-serif" font-size="28" font-weight="800" text-anchor="middle">85%</text>
      <text x="0" y="20" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">Active Learning</text>
    </g>

    <!-- Legend -->
    <g transform="translate(44, 340)">
      <circle cx="10" cy="10" r="6" fill="#1E6FD9" />
      <text x="26" y="14" fill="#E2E8F0" font-family="sans-serif" font-size="12">Critical Thinking &amp; Writing (Human Effort)</text>
      
      <circle cx="10" cy="38" r="6" fill="#FCD116" />
      <text x="26" y="42" fill="#E2E8F0" font-family="sans-serif" font-size="12">AI Scheduling, Structure &amp; Study Summaries</text>
      
      <rect x="0" y="60" width="412" height="36" rx="6" fill="#182C48" />
      <text x="12" y="82" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="600">Goal: Faster task organization without sacrificing understanding</text>
    </g>
  </g>
</svg>
