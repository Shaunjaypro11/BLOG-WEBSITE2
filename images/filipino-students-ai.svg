<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1E38" />
      <stop offset="100%" stop-color="#1A2D4E" />
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E6FD9" />
      <stop offset="100%" stop-color="#FCD116" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg2)" />

  <!-- Subtle Philippine Architectural / Classroom Window Lines -->
  <g opacity="0.07" stroke="#FFF" stroke-width="1.5">
    <rect x="120" y="80" width="300" height="480" rx="4" />
    <line x1="120" y1="240" x2="420" y2="240" />
    <line x1="120" y1="400" x2="420" y2="400" />
    <line x1="270" y1="80" x2="270" y2="560" />
    <rect x="780" y="80" width="300" height="480" rx="4" />
    <line x1="780" y1="240" x2="1080" y2="240" />
    <line x1="780" y1="400" x2="1080" y2="400" />
    <line x1="930" y1="80" x2="930" y2="560" />
  </g>

  <!-- Collaborative Study Table -->
  <ellipse cx="600" cy="580" rx="520" ry="120" fill="#13233D" stroke="#233B62" stroke-width="2" />

  <!-- Center Holographic/Screen Study Assistant -->
  <g transform="translate(420, 140)">
    <rect width="360" height="280" rx="16" fill="#0C182B" stroke="#1E6FD9" stroke-width="2" opacity="0.95" />
    <rect x="20" y="20" width="320" height="40" rx="8" fill="#172844" />
    <text x="36" y="45" fill="#FCD116" font-family="sans-serif" font-size="13" font-weight="700">COLLABORATIVE STUDY ASSISTANT</text>
    
    <!-- Comparison: Good AI Study vs Academic Honesty -->
    <rect x="20" y="75" width="150" height="180" rx="8" fill="#122038" stroke="#10B981" stroke-width="1.2" />
    <text x="32" y="98" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="700">✓ RESPONSIBLE</text>
    <text x="32" y="125" fill="#E2E8F0" font-family="sans-serif" font-size="11">• Asking for analogies</text>
    <text x="32" y="148" fill="#E2E8F0" font-family="sans-serif" font-size="11">• Generating quiz review</text>
    <text x="32" y="171" fill="#E2E8F0" font-family="sans-serif" font-size="11">• Outlining arguments</text>
    <text x="32" y="194" fill="#E2E8F0" font-family="sans-serif" font-size="11">• Checking code syntax</text>
    <text x="32" y="217" fill="#E2E8F0" font-family="sans-serif" font-size="11">• Brainstorming topics</text>

    <rect x="190" y="75" width="150" height="180" rx="8" fill="#122038" stroke="#CE1126" stroke-width="1.2" />
    <text x="202" y="98" fill="#EF4444" font-family="sans-serif" font-size="11" font-weight="700">✕ ACADEMIC RISK</text>
    <text x="202" y="125" fill="#94A3B8" font-family="sans-serif" font-size="11">• Copy-pasting essays</text>
    <text x="202" y="148" fill="#94A3B8" font-family="sans-serif" font-size="11">• Skipping lesson reading</text>
    <text x="202" y="171" fill="#94A3B8" font-family="sans-serif" font-size="11">• Faking references</text>
    <text x="202" y="194" fill="#94A3B8" font-family="sans-serif" font-size="11">• Unchecked AI outputs</text>
    <text x="202" y="217" fill="#94A3B8" font-family="sans-serif" font-size="11">• Loss of writing voice</text>
  </g>

  <!-- Left Student Figure (Stylized Silhouette & Laptop) -->
  <g transform="translate(180, 260)">
    <circle cx="100" cy="80" r="45" fill="#3B82F6" opacity="0.8" />
    <path d="M40 220 C40 150 70 140 100 140 C130 140 160 150 160 220 Z" fill="#1E3A5F" />
    <!-- Student Notebook & Tablet -->
    <rect x="130" y="190" width="110" height="70" rx="6" fill="#F8FAFC" opacity="0.9" transform="rotate(-12, 130, 190)" />
    <line x1="145" y1="205" x2="215" y2="190" stroke="#0B1F3A" stroke-width="2" />
    <line x1="145" y1="220" x2="205" y2="205" stroke="#0B1F3A" stroke-width="2" />
    <text x="50" y="260" fill="#93C5FD" font-family="sans-serif" font-size="12" font-weight="600">Student Researcher</text>
  </g>

  <!-- Right Student Figure (BSIT / High School Student) -->
  <g transform="translate(860, 260)">
    <circle cx="100" cy="80" r="45" fill="#FCD116" opacity="0.8" />
    <path d="M40 220 C40 150 70 140 100 140 C130 140 160 220 Z" fill="#1E3A5F" />
    <!-- Laptop -->
    <polygon points="50,210 150,210 165,250 35,250" fill="#253856" />
    <rect x="55" y="150" width="90" height="60" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
    <rect x="65" y="165" width="70" height="6" rx="2" fill="#38BDF8" />
    <rect x="65" y="177" width="50" height="6" rx="2" fill="#10B981" />
    <text x="60" y="270" fill="#FDE047" font-family="sans-serif" font-size="12" font-weight="600">Active Learner</text>
  </g>

  <!-- Philippine Context Badge Center Bottom -->
  <g transform="translate(450, 480)">
    <rect width="300" height="60" rx="30" fill="#0B1A30" stroke="#FCD116" stroke-width="1.5" />
    <text x="150" y="26" fill="#FCD116" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">PHILIPPINE ACADEMIC ETHICS</text>
    <text x="150" y="44" fill="#E2E8F0" font-family="sans-serif" font-size="11" text-anchor="middle">"Use AI as your study partner, not your substitute."</text>
  </g>
</svg>
