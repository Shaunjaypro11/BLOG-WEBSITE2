<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="avBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E6FD9" />
      <stop offset="100%" stop-color="#0B1F3A" />
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#avBg)" stroke="#FCD116" stroke-width="3" />
  
  <!-- Subtle code/tech background -->
  <text x="35" y="60" fill="#93C5FD" font-family="monospace" font-size="12" opacity="0.35">&lt;BSIT /&gt;</text>
  <text x="120" y="150" fill="#FDE047" font-family="monospace" font-size="12" opacity="0.35">{AI:edu}</text>

  <!-- Avatar Silhouette / Head & Shoulders -->
  <g fill="#F8FAFC">
    <!-- Head -->
    <circle cx="100" cy="78" r="32" />
    <!-- Glasses -->
    <rect x="74" y="70" width="22" height="15" rx="3" fill="none" stroke="#0B1F3A" stroke-width="2.5" />
    <rect x="104" y="70" width="22" height="15" rx="3" fill="none" stroke="#0B1F3A" stroke-width="2.5" />
    <line x1="96" y1="77" x2="104" y2="77" stroke="#0B1F3A" stroke-width="2.5" />
    
    <!-- Shoulders -->
    <path d="M45 170 C45 125 70 120 100 120 C130 120 155 125 155 170 Z" />
    <!-- Collar / Barong-inspired neck accent -->
    <path d="M90 120 L100 138 L110 120" fill="none" stroke="#CBD5E1" stroke-width="2" />
  </g>

  <!-- Small Philippines Badge at Bottom Corner -->
  <g transform="translate(142, 142)">
    <circle cx="18" cy="18" r="18" fill="#0E1B2E" stroke="#FCD116" stroke-width="2" />
    <text x="18" y="24" font-family="sans-serif" font-size="16" text-anchor="middle">🇵🇭</text>
  </g>
</svg>
