<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="clsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1A31" />
      <stop offset="100%" stop-color="#142646" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#clsBg)" />

  <!-- Classroom Blackboard / Interactive Whiteboard -->
  <rect x="200" y="80" width="800" height="340" rx="14" fill="#0C1B2E" stroke="#253C62" stroke-width="3" />
  <rect x="220" y="100" width="760" height="300" rx="8" fill="#071322" />

  <!-- Chalkboard / Screen content -->
  <text x="260" y="145" fill="#FCD116" font-family="sans-serif" font-size="14" font-weight="700">PHILIPPINE CLASSROOM PRINCIPLE:</text>
  <text x="260" y="185" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="800">"Technology can assist learning. Filipino students still lead it."</text>
  <line x1="260" y1="205" x2="940" y2="205" stroke="#1E6FD9" stroke-width="2" />

  <!-- Classroom Dialogue Pillars -->
  <g transform="translate(260, 230)">
    <rect width="210" height="130" rx="8" fill="#0F2038" stroke="#1E6FD9" stroke-width="1" />
    <text x="16" y="32" fill="#60A5FA" font-family="sans-serif" font-size="12" font-weight="700">TEACHER'S ROLE</text>
    <text x="16" y="58" fill="#E2E8F0" font-family="sans-serif" font-size="11">• Contextualizing culture</text>
    <text x="16" y="78" fill="#E2E8F0" font-family="sans-serif" font-size="11">• Ethical moral compass</text>
    <text x="16" y="98" fill="#E2E8F0" font-family="sans-serif" font-size="11">• Inspiring perseverance</text>
  </g>

  <g transform="translate(500, 230)">
    <rect width="210" height="130" rx="8" fill="#0F2038" stroke="#FCD116" stroke-width="1" />
    <text x="16" y="32" fill="#FCD116" font-family="sans-serif" font-size="12" font-weight="700">AI AS STUDY PARTNER</text>
    <text x="16" y="58" fill="#E2E8F0" font-family="sans-serif" font-size="11">• Simplifying jargon</text>
    <text x="16" y="78" fill="#E2E8F0" font-family="sans-serif" font-size="11">• Drill practice questions</text>
    <text x="16" y="98" fill="#E2E8F0" font-family="sans-serif" font-size="11">• Scheduling reminders</text>
  </g>

  <g transform="translate(740, 230)">
    <rect width="200" height="130" rx="8" fill="#0F2038" stroke="#10B981" stroke-width="1" />
    <text x="16" y="32" fill="#34D399" font-family="sans-serif" font-size="12" font-weight="700">STUDENT EFFORT</text>
    <text x="16" y="58" fill="#E2E8F0" font-family="sans-serif" font-size="11">• Genuine understanding</text>
    <text x="16" y="78" fill="#E2E8F0" font-family="sans-serif" font-size="11">• Original writing voice</text>
    <text x="16" y="98" fill="#E2E8F0" font-family="sans-serif" font-size="11">• Real problem-solving</text>
  </g>

  <!-- Classroom Desk & Student Silhouettes -->
  <polygon points="120,630 1080,630 1140,675 60,675" fill="#182740" stroke="#253A5A" stroke-width="2" />
  
  <!-- Desk Notebooks and Laptops -->
  <g transform="translate(300, 520)">
    <!-- Student Notebook -->
    <rect x="0" y="20" width="140" height="85" rx="4" fill="#F1F5F9" />
    <line x1="15" y1="35" x2="125" y2="35" stroke="#3B82F6" stroke-width="2" />
    <line x1="15" y1="50" x2="115" y2="50" stroke="#CBD5E1" stroke-width="2" />
    <line x1="15" y1="65" x2="105" y2="65" stroke="#CBD5E1" stroke-width="2" />
    <line x1="15" y1="80" x2="120" y2="80" stroke="#CBD5E1" stroke-width="2" />
  </g>

  <g transform="translate(540, 480)">
    <!-- Modern Student Laptop -->
    <polygon points="20,100 180,100 195,125 5,125" fill="#2D3F5C" />
    <rect x="25" y="40" width="150" height="90" rx="6" fill="#0D1B2E" stroke="#38BDF8" stroke-width="1.5" />
    <rect x="35" y="50" width="130" height="20" rx="4" fill="#192A44" />
    <text x="100" y="64" fill="#38BDF8" font-family="sans-serif" font-size="9" text-anchor="middle">RESEARCH DEFENSE PREP</text>
  </g>

  <g transform="translate(800, 510)">
    <!-- Traditional Books & Calculator -->
    <rect x="0" y="40" width="120" height="30" rx="3" fill="#CE1126" opacity="0.85" />
    <rect x="5" y="20" width="110" height="25" rx="3" fill="#0038A8" opacity="0.85" />
    <rect x="10" y="5" width="100" height="20" rx="3" fill="#FCD116" opacity="0.85" />
    <text x="60" y="19" fill="#000" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">PHILIPPINE CONTEXT</text>
  </g>
</svg>
